; Quotidian - LilyGo T5 4.7" e-paper (ESP32-S3), non-touch version.
;
;   pio run -t upload -t monitor
;
; The firmware lives under firmware/ so it sits alongside the data pipeline,
; but this file stays at the repo root so PlatformIO picks the project up on open.
;
; Wi-Fi is NOT configured here - it is entered on the device at first boot.
; See firmware/README.md.

[platformio]
boards_dir = firmware/boards
src_dir = firmware/src

; The filesystem image is built from here, NOT from the default `data/`. That
; directory holds the pipeline's intermediates - including a 12 MB corpus - and
; pointing the image at it silently tries to flash the lot. It has to be set in
; this section: `board_build.data_dir` in the env is not a real option, is
; accepted without complaint, and does nothing.
;
; The export already has the shape the firmware opens:
;   data/device/quotes/MM-DD.tsv  ->  /quotes/MM-DD.tsv
data_dir = data/device

[env:T5-ePaper-S3]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino

; The quote dataset lives in internal flash rather than on an SD card, in the
; partition the stock 16 MB table labels "spiffs" - the label is historical,
; LittleFS is what is written to it. 1.2 MB of data lands at about 1.4 MB once
; rounded up to 4 kB blocks, against a 3.375 MB partition, so the stock table is
; enough and the unused OTA slot is left alone.
;
; The image is built from data_dir, set in the [platformio] section above.
;
;   npm run export:device     regenerate the files
;   pio run -t buildfs        pack them, and check they fit
;   pio run -t uploadfs       write them to the device
;
; uploadfs is independent of the firmware upload: the dataset can be replaced
; without reflashing the application, which is the one useful property the SD
; card had.
board_build.filesystem = littlefs

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder

build_flags =
    ; 8 MB OPI PSRAM holds the 960x540 4-bit framebuffer (253 kB).
    -DBOARD_HAS_PSRAM
    ; Route Serial over native USB. Also carries Improv Wi-Fi provisioning, so
    ; leave it on unless you are running from battery with no USB attached -
    ; boot then blocks waiting for a terminal.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Pinned to exact commits so a fresh clone builds the same firmware. Neither
; upstream publishes tagged releases to the PlatformIO registry, so a floating
; branch reference would let an unrelated upstream change break the build.
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#5b1adc7100cce95529ace84278fcdc3aa0439c85
    ; QR codes for the Wi-Fi setup screen.
    https://github.com/ricmoo/QRCode.git#eafbde494979abc2445c363cc2602230bcbe299c
