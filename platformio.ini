; Quote of the Day - LilyGo T5 4.7" e-paper (ESP32-S3), non-touch version.
;
;   pio run -t upload -t monitor

; The firmware lives under firmware/ so it sits alongside the data pipeline,
; but this file stays at the repo root so PlatformIO picks the project up on open.
[platformio]
boards_dir = firmware/boards
src_dir = firmware/src

[env:T5-ePaper-S3]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder

build_flags =
    ; 8 MB OPI PSRAM holds the 960x540 4-bit framebuffer (253 kB).
    -DBOARD_HAS_PSRAM
    ; Route Serial over native USB. Comment out when running on battery,
    ; otherwise boot blocks waiting for a terminal.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git
